<!DOCTYPE html>
<html lang="{{ site.lang | default: 'es' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    {% seo %}
  </head>
  <body>
    <div id="container">
      <div class="inner">
        <header class="site-header">
          <div>
            <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
            <p class="tagline">{{ site.description }}</p>
          </div>
          <nav>
            <a href="{{ '/cv/' | relative_url }}">CV</a>
          </nav>
        </header>

        <main id="main_content">
          {{ content }}
        </main>

        <footer>
          <a href="{{ site.github_url }}">GitHub</a> ·
          <a href="{{ site.linkedin_url }}">LinkedIn</a>
        </footer>
      </div>
    </div>
  </body>
</html>
